// SwiftGibs — Preferences Profiles (Task 3). Save/load/delete named snapshots of the
// full SwiftGibs settings surface (sgProfileVars, overlay/autoexec.cfg). Files live at
// profiles/<name>.cfg under the game home dir, written by the saveprofile ICOMMAND
// (patches/16-profiles.patch); loading is a plain `exec`, no engine support needed.
//
// GOTCHA: guibutton actions built inside a loop must bake the loop var into a SINGLE
// baked command via concatword (never reference $loopvar inside a `[...]` block - it
// reads whatever the var holds when the button is finally clicked, i.e. the LAST
// iteration's value, not the row's own value). sgLoadProfile/sgDeleteProfile below take
// the name as $arg1 so each row only ever bakes one command + one argument.
//
// sgprofileversion / sgProfileSchemaVersion: see the profile-schema-version comment in
// overlay/autoexec.cfg (right above sgProfileVars) for the full story. Short version: reset
// the marker to "" before exec so we can tell whether the file we just loaded set it back
// (new-format profile) or left it untouched (pre-v1.3.0 profile, no marker line at all) - the
// latter means cliplength's raw persisted value is under the OLD minutes unit, which the new
// seconds-denominated VARFP would otherwise silently misread (an old "cliplength 5" - five
// MINUTES - becomes 5 SECONDS, 60x too short, with no warning). Force the current 20s default
// in that case, restamp the marker so a re-save immediately carries it forward, and say so once.
sgLoadProfile = [
  sgprofileversion = ""
  exec (concatword "profiles/" $arg1 ".cfg")
  if (strcmp $sgprofileversion "") [
    cliplength 20
    sgprofileversion = $sgProfileSchemaVersion
    echo "^f4profile predates the 20s clip default - clip length set to 20s, re-save the profile to keep your own value"
  ] []
  echo (concatword "^f2profile " $arg1 " loaded")
]
sgDeleteProfile = [ delprofile $arg1 ]

sgNewProfName = ""

newgui profiles [ guistayopen [
    guititle "Preferences Profiles"
    guibar
    guitext "^f4Save your current SwiftGibs settings under a name, then load or delete it later."
    guilist [ guitext "New profile: " ; guifield sgNewProfName 16 [ if (strcmp $sgNewProfName "") [] [ saveprofile $sgNewProfName ; sgNewProfName = "" ] ] ]
    guibutton "save current settings.." [ if (strcmp $sgNewProfName "") [] [ saveprofile $sgNewProfName ; sgNewProfName = "" ] ]
    guibar
    guitext "^f2Saved profiles"
    sgProfCount = 0
    sgProfIgnored = 0
    loopfiles sgPf profiles cfg [
        // Filenames on disk are NOT guaranteed to have been written by saveprofile (a
        // downloaded profile pack or manual copy could contain CubeScript metacharacters),
        // and $sgPf is baked verbatim into a clickable guibutton action below - so any name
        // that fails the same charset saveprofile enforces must be skipped entirely rather
        // than rendered, or a hostile filename becomes arbitrary script execution on click.
        if (profilenamevalid $sgPf) [
            sgProfCount = (+ $sgProfCount 1)
            guilist [
                guitext $sgPf
                guispring
                guibutton "load"        (concatword "sgLoadProfile " $sgPf)
                guistrut 1
                guibutton "^f3delete"   (concatword "sgDeleteProfile " $sgPf)
            ]
        ] [
            sgProfIgnored = (+ $sgProfIgnored 1)
        ]
    ]
    if (= $sgProfCount 0) [ guitext "^f4No profiles saved yet" ] []
    if (> $sgProfIgnored 0) [ guitext (concatword "^f4ignored " $sgProfIgnored " invalid profile files") ] []
    guibar
    guibutton "back" [ cleargui 1 ]
] ] "profiles"
