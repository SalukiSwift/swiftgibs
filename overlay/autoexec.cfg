// Entirely C++-side (fpsgame/fps.cpp): sampling, the frame-time histogram, the console summary,
// the fpsstats.csv log row and the session-scoped recent-results list are all built there and
// need no CubeScript glue - fpsstats/fpsstatslog/fpsstatskeep/fpsstatsstutter are plain VARPs
// (persist via config.cfg like any other setting) and fpsstatscount/fpsstatsline are the two
// read-only ICOMMANDs the "fps stats.." page (menus_stats.cfg) polls to render the list.
