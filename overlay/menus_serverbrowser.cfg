// SwiftGibs — server-browser gui reproduction (Task 10: "show non-instagib servers" checkbox).
//
// The stock server-browser gui is `newgui servers [ ... ] "" [initservers]`, defined in the
// official data/menus.cfg (fetched fresh at build time by build/fetch-official-data.sh from a
// pinned upstream release URL, so this exact text is not a moving target). It is small and
// self-contained (one settings row + one call into the engine-builtin `guiservers`, which owns
// the actual list/columns/sort/connect logic) — unlike the much larger stock "options" gui,
// which SwiftGibs extends via a build-time byte-splice (build/integrate-menus.sh) specifically
// because it is too large/fragile to safely reproduce verbatim.
//
// CubeScript's `newgui` simply (re)registers a gui body under a name; whichever definition runs
// LAST wins. The engine execs data/menus.cfg during init (main.cpp) and only execs autoexec.cfg
// afterwards, so redefining `newgui servers` here — reached via `exec menus_serverbrowser.cfg`
// from autoexec.cfg — overwrites the stock definition with this one.
//
// Everything below is byte-for-byte identical to the stock block (confirmed against the actual
// fetched-and-packaged data/menus.cfg) EXCEPT the line marked "SwiftGibs addition": one more
// checkbox on the existing settings row (Task 10, next to "search LAN" / "auto-update" /
// "auto-sort"). None of this touches `guiservers` itself (the list/sort/connect/column engine
// builtin) - the favourite checkbox column it renders is added entirely on the C++ side
// (patches/20-server-qol.patch: fpsgame/fps.cpp's serverinfoentry, engine/serverbrowser.cpp).
// The password prompt (patch 20/QoL batch item 7) is a genuinely separate dialog gui,
// "sgpasswordprompt" at the end of this file (field-fix round 2, item 3) - this "servers" gui
// no longer references it or its state at all.
//
// Width-fix (2026-08-10, spec deviation from the original patch 20): the top settings row used
// to also carry an inline hint guitext ("fav = star a server (pins it to the top); pw.. =
// connect with a password") in the same guilist as the checkboxes. At ~74 characters it was by
// far the widest row in the whole gui, which forces the entire panel to scale down to fit it on
// screen - shrinking every column's text along with it. That was the real driver of the
// reported menu-shrink regression, not the two extra per-row columns alone. Fixed by dropping
// the hint entirely rather than relocating it - the checkbox glyph and the password-on-click
// flow are both self-explanatory in use, and the "pw.." row action it referenced has also been
// removed (see below and width-fix-report.md).
//
// Field-fix round 2 (2026-08-10, items 1-4, straight from April's playtest):
// 1/2. "clicking any server seems to favorite it" + "I'd rather the favorite toggle be a
//    checkbox": both root-caused and fixed on the C++ side (fpsgame/fps.cpp's
//    serverinfostartcolumn/serverinfoentry, patches/20-server-qol.patch) - the favourite column
//    is now a real checkbox_on/checkbox_off cell with its own independent, correctly x-bounded
//    click box; nothing to change here.
// 3. "the password popup changes the size of the server browser": the inline field/connect/
//    cancel block that used to live INSIDE this newgui (right where this comment is) has been
//    replaced by its own separate dialog, "sgpasswordprompt" below - showing or hiding it never
//    touches this gui's own rows/size again. This is the browser's own definition and, ever
//    since removing that inline block, is now COMPLETELY UNCHANGED by whether a password prompt
//    exists at all.
// 4. "pops up on servers that dont require a password": engine/client.cpp's connectserv() now
//    clears the transient prompt flag at the very start of every new connect attempt, and
//    engine/serverbrowser.cpp's resetpasswordprompt() clears it fully on cancel and on a
//    successful join - see field-fix-round2.md for the full trace of every reset path.
newgui servers [
    guistayopen [
        guiservers [
            guilist [
                guibutton "update from master server" "updatefrommaster"
                guibar
                guicheckbox "search LAN" searchlan
                guibar
                guicheckbox "auto-update" autoupdateservers
                guibar
                guicheckbox "auto-sort" autosortservers
                if (= $autosortservers 0) [
                    guibar
                    guibutton "sort" "sortservers"
                ]
                guibar                                                                          // SwiftGibs addition
                guicheckbox "show all game modes (not just instagib)" filterinstaservers 0 1     // SwiftGibs addition
            ]
            guibar
        ] 17
    ]
] "" [initservers]

// ---- Server password prompt (patch 20/QoL batch item 7, redesigned field-fix round 2 item 3)
// ----
// Its own separate dialog gui - NOT rows injected into "servers" above - so the server browser
// panel's own size is never affected by whether this box is showing (the original inline-block
// design changed the browser's own dimensions every time the box appeared or disappeared, a
// field-reported bug). engine/serverbrowser.cpp's triggerpasswordprompt() opens "servers" first
// (so there is a sensible page behind this one) then stacks this dialog on top of it, the same
// popup-over-a-parent-page pattern menus_profiles.cfg's own sub-pages already use ("cancel"
// pops exactly one level via `cleargui 1`, never the parent page underneath).
//
// PLAINTEXT HONESTY: whatever is typed here is saved to serverpasswords.cfg unencrypted on a
// successful join - same as the stock servers.cfg already does for any password you've ever
// typed to connect (this predates SwiftGibs). Never masked (guifield has no such mode in this
// 2020 engine build) - be mindful of who can see your screen.
//
// sgcancelpwprompt (C++, engine/serverbrowser.cpp) resets every transient prompt var; the
// "connect" button below does NOT close this dialog itself - a submitted attempt is asynchronous
// (the real result arrives over the network a moment later), so closing happens once the outcome
// is known: fpsgame/client.cpp's N_WELCOME handler closes everything on success, and a renewed
// rejection just re-shows this same dialog with the field cleared (triggerpasswordprompt again).
// This avoids a visible flash of the browser between clicking "connect" and the box reappearing.
newgui sgpasswordprompt [ guistayopen [
    guititle "Server Password"
    guibar
    guitext (concatword "password for " $sgpwpromptserver ":" $sgpwpromptport)
    guitext "^f4saved in plaintext next to servers.cfg on success"
    guifield sgpwpromptvalue -24 [ sgconnectwithprompt ]
    guibar
    guilist [ guibutton "connect" [ sgconnectwithprompt ] ; guistrut 2 ; guibutton "cancel" [ sgcancelpwprompt ; cleargui 1 ] ]
] ] "server password"
