// SwiftGibs — server-browser gui reproduction (Task 10: "show non-instagib servers" checkbox).
//
// The stock server-browser gui is `newgui servers [ ... ] "" [initservers]`, defined in the
// official data/menus.cfg (fetched fresh at build time by build/fetch-official-data.sh from a
// pinned upstream release URL, so this exact text is not a moving target). It is small and
// self-contained (one settings row + one call into the engine-builtin `guiservers`, which owns
// the actual list/columns/sort/connect logic) — unlike the much larger stock "options" gui,
// which SwiftGibs extends via a build-time byte-splice (build/integrate-menus.sh) specifically
// because it is too large/fragile to safely reproduce verbatim.
//
// CubeScript's `newgui` simply (re)registers a gui body under a name; whichever definition runs
// LAST wins. The engine execs data/menus.cfg during init (main.cpp) and only execs autoexec.cfg
// afterwards, so redefining `newgui servers` here — reached via `exec menus_serverbrowser.cfg`
// from autoexec.cfg — overwrites the stock definition with this one.
//
// Everything below is byte-for-byte identical to the stock block (confirmed against the actual
// fetched-and-packaged data/menus.cfg) EXCEPT the lines marked "SwiftGibs addition": one more
// checkbox on the existing settings row (Task 10, next to "search LAN" / "auto-update" /
// "auto-sort"), and the password-prompt block (patch 20/QoL batch item 7). None of this touches
// `guiservers` itself (the list/sort/connect/column engine builtin) - the favourite-star column
// it renders is added on the C++ side (patches/20-server-qol.patch: fpsgame/fps.cpp's
// serverinfoentry, engine/serverbrowser.cpp). This file only has to react to that C++ side
// setting sgpwpromptactive.
//
// Width-fix (2026-08-10, spec deviation from the original patch 20): the top settings row used
// to also carry an inline hint guitext ("fav = star a server (pins it to the top); pw.. =
// connect with a password") in the same guilist as the checkboxes. At ~74 characters it was by
// far the widest row in the whole gui, which forces the entire panel to scale down to fit it on
// screen - shrinking every column's text along with it. That was the real driver of the
// reported menu-shrink regression, not the two extra per-row columns alone. Fixed by dropping
// the hint entirely rather than relocating it - the star glyph and the password-on-click flow
// are both self-explanatory in use, and the "pw.." row action it referenced has also been
// removed (see below and width-fix-report.md).
newgui servers [
    guistayopen [
        // SwiftGibs addition: password box (patch 20). engine/client.cpp's disconnect handler
        // sets sgpwpromptactive=1 when a menu-initiated connect gets rejected for a bad/missing
        // password - one failed attempt on a normal row click, then this box (the earlier
        // pre-emptive "pw.." row action was removed as part of the width fix; see the file
        // header comment above). PLAINTEXT HONESTY: whatever is typed here is saved to
        // serverpasswords.cfg unencrypted on a successful join - same as the stock servers.cfg
        // already does for any password you've ever typed to connect (this predates SwiftGibs).
        // Never masked (guifield has no such mode in this 2020 engine build) - be mindful of
        // who can see your screen.
        if (= $sgpwpromptactive 1) [
            guilist [
                guibar
                guitext (concatword "password for " $sgpwpromptserver ":" $sgpwpromptport " (saved in plaintext next to servers.cfg on success)")
                guilist [
                    guifield sgpwpromptvalue -24 [ sgconnectwithprompt ]
                    guibutton "connect" [ sgconnectwithprompt ]
                    guibutton "cancel" [ sgcancelpwprompt ]
                ]
                guibar
            ]
        ]
        guiservers [
            guilist [
                guibutton "update from master server" "updatefrommaster"
                guibar
                guicheckbox "search LAN" searchlan
                guibar
                guicheckbox "auto-update" autoupdateservers
                guibar
                guicheckbox "auto-sort" autosortservers
                if (= $autosortservers 0) [
                    guibar
                    guibutton "sort" "sortservers"
                ]
                guibar                                                                          // SwiftGibs addition
                guicheckbox "show all game modes (not just instagib)" filterinstaservers 0 1     // SwiftGibs addition
            ]
            guibar
        ] 17
    ]
] "" [initservers]
