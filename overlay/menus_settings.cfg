// SwiftGibs — settings tab bodies. Attached to Esc->options as tabs by build/integrate-menus.sh
// (which adds `guitab "SwiftGibs"; sgSwiftgibsTab` and `guitab "Friends"; sgFriendsTab` to the
// stock options gui). Colour codes: ^f0 green, ^f3 red, ^f4 grey.
//
// LAYOUT RULE: a tab auto-paginates into an ugly NUMBERED tab when its content exceeds
// ~16 text rows (engine `guiautotab`, 3dgui.cpp). So tabs stay small HUBS; anything bulky
// or dynamic lives on a dedicated sub-page (showgui), where extra height is fine.
// Interactive bodies are wrapped in `guistayopen [ ... ]` so controls adjust in place; "back"
// buttons use `cleargui 1` (pop one level - bare cleargui exits the whole menu stack).
//
// LIVE DEMOS: every cue control carries an onchange action so picking an option previews it
// immediately - `reloadcountdemo` runs a real 3-2-1 with the current countdown style, ready
// flash AND metronome on the HUD (drawn even over the main menu: gl_drawmainmenu calls
// gl_drawhud -> gameplayhud); `playhitsoundpreview` / `playstreaksound` audition the sounds.

sgFriendName = ""
sgFbCat = 0
sgFbText = ""
sgFbShot = 0
sgFbName = 0
feedbackstatus = ""

// ============ SwiftGibs tab: general + HUD ============
// Menu philosophy after the 2026-07-20 revamp: SwiftGibs = general/HUD settings,
// Cues = everything you SEE (timing cues, markers, streak fx), Audio = everything
// you HEAR, Friends = social. Anything slider-heavy lives on a sub-page.
sgSwiftgibsTab = [ guistayopen [
    guicheckbox "server browser: instagib servers only"  filterinstaservers
    guibar
    guitext "^f2Scoreboard"
    guilist [ guicheckbox "frags (all modes)" hidefrags 0 1 ; guistrut 1 ; guicheckbox "deaths" showdeaths ; guistrut 1 ; guicheckbox "KDR" showkdr ]
    guilist [ guicheckbox "captures" showcaptures ; guistrut 1 ; guicheckbox "accuracy" showacc ; guistrut 1 ; guicheckbox "damage" showdmg ; guistrut 1 ; guicheckbox "best streak" showstreakcol ]
    guibar
    guitext "^f2Players and view"
    guilist [ guicheckbox "highlight friends" highlightfriends ; guistrut 1 ; guicheckbox "highlight my name" highlightself ; guistrut 1 ; guicheckbox "incl. enemy friends" enemyfriendhl ]
    guilist [ guitext "Teammate crosshair: " ; guiradio "Off" teamcrosshair 0 ; guibutton "Colour" [teamcrosshair 1; teamcrosshairstyle 1] ; guibutton "Icon" [teamcrosshair 1; teamcrosshairstyle 0] ]
    guilist [ guicheckbox "blocky lighting (next map)" bilinear 0 1 [ echo "^f2blocky lighting: change applies when the next map loads" ] ; guistrut 1 ; guicheckbox "flag-carry popup" flagcarrypopup ; guistrut 1 ; guicheckbox "clean screenshots (hide hud)" cleanshots ]
    guilist [ guicheckbox "map-vote panel auto-opens at intermission" mapvotepopup ; guistrut 1 ; guibutton "open now" [ showgui "mapvote" ] ; guistrut 2 ; guicheckbox "auto-respawn" autorespawn ; guistrut 1 ; guicheckbox "ready sound" respawnreadysound ; guistrut 2 ; guicheckbox "fps stats" fpsstats ]
    guilist [ guicheckbox "instant replay clips" clips ; guistrut 1 ; guitext "^f4F10 saves last" ; guibutton "-" [ cliplength (- $cliplength 1) ] ; guitext (concatword $cliplength "m") ; guibutton "+" [ cliplength (+ $cliplength 1) ] ; guistrut 2 ; guicheckbox "^f4auto-record match" cliprecordauto ]
    guibar
    guitext "^f2Aim   ^f4deep zoom strength (Mouse6/7; lower = closer)"
    guislider deepzoomfov 8 30
    guilist [ guitext "^f4zoom button: " ; guiradio "click to toggle" zoomholdmode 0 ; guiradio "hold to zoom" zoomholdmode 1 ; guistrut 2 ; guibutton "sens translator.." [ showgui senstranslator ] ]
    guibar
    guilist [ guibutton "career stats.." [ showgui swiftstats ] ; guistrut 2 ; guibutton "fps stats.." [ showgui swiftfps ] ; guistrut 2 ; guibutton "chat history.." [ showgui swiftchat ] ; guistrut 2 ; guibutton "profiles.." [ showgui profiles ] ; guistrut 2 ; guibutton "clips.." [ showgui swiftcliplist ] ; guistrut 2 ; guibutton "send feedback.." [ sgFbShot = 0 ; showgui feedback ] ; guistrut 2 ; guibutton "take screenshot" [ cleargui ; sleep 120 [ swiftshot ] ] ]
] ]

// ---- sensitivity translator: convert a sens from another game via cm/360 maths.
// Sauer: degrees per count = sensitivity / (33 * sensitivityscale)  (rendergl.cpp mousemove)
// Other games: degrees per count = sens * yaw. Equal feel <=> equal degrees per count.
// Yaw constants are the widely documented ones; same-engine families share a value. ----
sgSensIn = ""
sgSensGame = 0
sgSensYaws = "0.022 0.022 0.022 0.0066 0.0066 0.07"
sgSensNames = "CS/Source/TF2 Quake Apex Overwatch CoD Valorant"
sgSensCalc = [ result (*f $sgSensIn (*f (at $sgSensYaws $sgSensGame) (*f 33.0 $sensitivityscale))) ]
sgSensBack = [ result (divf $sensitivity (*f (at $sgSensYaws $arg1) (*f 33.0 $sensitivityscale))) ]
newgui senstranslator [ guistayopen [
    guitext "Convert a sensitivity from another game"
    guilist [ guitext "their sens: " ; guifield sgSensIn 8 [] ]
    guitext (concatword "from:  " (at $sgSensNames $sgSensGame))
    guilist [ guiradio "CS/Source/TF2" sgSensGame 0 ; guiradio "Quake" sgSensGame 1 ; guiradio "Apex" sgSensGame 2 ]
    guilist [ guiradio "Overwatch" sgSensGame 3 ; guiradio "CoD" sgSensGame 4 ; guiradio "Valorant" sgSensGame 5 ]
    if (strcmp $sgSensIn "") [
        guitext "^f4type a sens above to convert"
    ] [
        guitext (concatword "^f2= SwiftGibs sensitivity " (sgSensCalc))
        guibutton (concatword "apply " (sgSensCalc) " now") [ sensitivity (sgSensCalc) ; echo (concatword "^f2sensitivity set to " $sensitivity) ]
    ]
    guibar
    guitext (concatword "Your current sens " $sensitivity " in other games:")
    guitext (concatword "  CS/Source/TF2 " (sgSensBack 0) "   Quake/Apex " (sgSensBack 1))
    guitext (concatword "  Overwatch/CoD " (sgSensBack 3) "   Valorant " (sgSensBack 5))
    guibar
    guibutton "back" [ cleargui 1 ]
] ] "sens translator"

// ---- Replay Clips browser (playback discoverability fix, playtest 1 bug, 2026-07-30) ----
// April saved a clip and could not play it: clips live in clipdir, but neither the stock
// `demo` command nor the stock demo browser ever look there. This page + `playclip <name>`
// (overlay/autoexec.cfg) are April's chosen fix - see the design doc's "Playback
// discoverability" section. Lists clipdir newest-first via the C++ clipfilecount()/
// clipfilename()/clipfileline() accessors (fpsgame/client.cpp, patches/17-replay-clips.patch) -
// the same fpsstatscount()/fpsstatsline() division of labour as the FPS stats page above: C++
// owns the directory read, the sort, and the label parsing; this page is purely a viewer +
// click-to-play front end. clipfileline() already tags each row [clip], [recording], or
// [auto-rec] straight from the filename (saveclip()/startcliprecorder() write distinguishably-
// suffixed names - see that function's own comment for the exact pattern), and shows the
// parsed date/time, map, and mode rather than the raw filename.
//
// GOTCHA (documented in .superpowers/sdd/global-constraints.md, and the exact bug
// menus_profiles.cfg's sgLoadProfile comment already warns about): the play button MUST bake
// the filename into its action with concatword, evaluated AT LOOP TIME - never reference the
// loop var inside a deferred `[...]` block, which would replay whatever the LAST row's filename
// was, not the row that was actually clicked. clipfilename($i) below is called immediately,
// inside the concatword, so it collapses to a fixed string before the button is even drawn.
//
// sgClipCap: guis do not scroll (same reason menus_mapvote.cfg caps its own list). Beyond the
// cap the older files are still on disk and still playable via `playclip <name>` from the
// console (or console history/tab-complete) - only the newest sgClipCap rows render here.
//
// ---- clip video export (clip-export feature, Task 5) ----
// sgOpenExportSettings takes the clip name as $arg1, same one-argument-per-row idiom
// menus_profiles.cfg's sgLoadProfile/sgDeleteProfile already established for this exact
// concatword-baking gotcha (global-constraints.md item 8): the row below bakes ONE call to
// this alias with the filename already resolved via clipfilename($i) AT LOOP TIME, so each
// row's export button opens the settings page remembering its OWN clip, never the last row
// drawn - see "PROVE the concatword baking on a non-first row" in the task's own verify
// notes for how this was tested. sgExportClip is read by the "swiftexport" settings page
// (below) and is what the "start export" button there actually passes to exportclip().
//
// GOTCHA found while testing this page (not in global-constraints.md, worth recording): a
// plain `showgui <name>` while a DIFFERENT gui is already the current top of the gui stack
// renders essentially invisible/blank - empirically confirmed with a screenshot, not just
// reasoned about (a bare `showgui swiftexport` called from inside swiftcliplist's own button
// action produced a blank frame with none of swiftexport's content visible, even though the
// underlying state - sgExportClip, etc - was set correctly). `cleargui 1` (pop the current
// page) immediately before the new `showgui` fixes it, and is already the exact pattern the
// existing "play" button on the row above uses (`cleargui 1; playclip ...`) - matched here for
// consistency, not just to fix the bug.
//
// sgExportName (QoL batch: custom export name) is the page's own text field, prefilled every
// time the page opens with the automatic name for THIS clip - clipexportautoname() (fpsgame/
// client.cpp) is the single source of truth for what that automatic name actually is, shared
// with exportclip()'s own fallback when the field is left empty, so the prefill can never drift
// out of sync with what an empty field really produces. Overtyping it is the custom name;
// clearing it back to empty reverts to automatic - both handled entirely on the C++ side
// (exportclip()'s new customname argument), this page just passes whatever is currently typed.
sgExportClip = ""
sgExportName = ""
sgOpenExportSettings = [ cleargui 1 ; sgExportClip = $arg1 ; sgExportName = (clipexportautoname $arg1) ; showgui swiftexport ]
sgClipCap = 8
newgui swiftcliplist [ guistayopen [
    guititle "Replay Clips"
    guibar
    sgClipTotal = (clipfilecount)
    loop i (min $sgClipTotal $sgClipCap) [
        guilist [
            guitext (clipfileline $i)
            guispring
            guibutton "play" (concatword "cleargui 1; playclip " (clipfilename $i))
            guistrut 1
            guibutton "export.." (concatword "sgOpenExportSettings " (clipfilename $i))
        ]
    ]
    if (= $sgClipTotal 0) [ guitext "^f4no clips yet - F10 saves the last few minutes, F9 starts/stops a recording" ] []
    if (> $sgClipTotal $sgClipCap) [ guitext (concatword "^f4...and " (- $sgClipTotal $sgClipCap) " more (newest " $sgClipCap " shown)") ] []
    guibar
    guibutton "back" [ cleargui 1 ]
] ] "clips"

// ---- Export settings page: name / format / resolution / fps / sound / quality / output folder,
// plus a live size estimate, reached from the "export.." button on the row above (never from
// the SwiftGibs tab - see global-constraints.md, the tab has ~0.7 rows of headroom left and
// the clips.. button already used some of it). All six settings below (not counting the name
// field) are real C++ VARPs (fpsgame/client.cpp, patches/19-clip-export.patch) so they
// round-trip through config.cfg automatically and are added to sgProfileVars (overlay/
// autoexec.cfg) so a saved profile captures every one of them, same as any other setting.
// The name field (sgExportName, above) is deliberately NOT one of those six and NOT in
// sgProfileVars - like sgExportClip, it is session-scoped selection state (this clip's
// filename), reset to the automatic name every time this page opens, not a saved preference.
//
// QoL batch (custom export name + auto-return): the name field is prefilled with the automatic
// name and passed as exportclip()'s new customname argument - empty means "keep the automatic
// name" exactly as before this field existed. On success, or on any non-cancellation stop
// (ffmpeg failure, disconnect, a map/load problem, etc), the C++ side now leaves the replay and
// returns to the main menu on its own, printing either "exported: <filename>" or the existing
// error line - see fpsgame/client.cpp's clipexportpendingreturn for the deferred mechanism.
// ESC/cancelclipexport (overlay/autoexec.cfg's sgCancelExport) is deliberately excluded and
// keeps its existing behaviour unchanged.
//
// SIZE ESTIMATE: two numbers, clearly labelled, matching the design doc's own instruction to
// be honest about which is which. "raw intermediate" is the exact width*height*1.5*fps
// formula (engine/movie.cpp's own bitrate, confirmed against the design doc's own worked
// examples: 1280x720@60fps = 82,944,000 B/s = ~83 MB/s, matching here) - it is NEVER actually
// written to disk in this feature's piped design (see checkclipexport(), fpsgame/client.cpp:
// frames go straight from the capture buffer into ffmpeg's stdin, no temp AVI), so it is
// shown purely as "this is how big raw video is," not a real file. "estimated final video" is
// the number that actually matters - derived from a compression ratio per quality tier,
// CALIBRATED against a real measured export (ce-task-3-report.md: a real 640x360@30fps clip,
// crf20/quality=normal, produced a real 2.7MB file over 64.2s -> ~42,057 B/s compressed
// against a 10,368,000 B/s raw rate for that same resolution/fps = a ~246x ratio) with the
// other two quality tiers scaled by the standard x264/vpx "+/-6 crf ~ half/double bitrate"
// rule of thumb (matching the same +/-6 crf steps fpsgame/client.cpp's mp4crf/webmcrf tables
// use) - documented here so a future session can see exactly where these constants came from
// and recalibrate them against fresh measurements if they turn out to be off.
sgExportRatioMp4  = "492 246 155" // low / normal(measured) / high
sgExportRatioWebm = "492 246 155" // not independently measured for VP9 in this sandbox (no real webm export was captured against a known duration in earlier tasks) - reusing the mp4 calibration as a documented, honest approximation rather than a made-up different number; see ce-task-5-report.md
// QoL batch (lossless export): a single measured ratio, repeated three times so the same
// `(at ... $clipexportquality)` indexing sgExportRatio (below) already uses keeps working
// unchanged even though clipexportquality is entirely ignored for a lossless export (ffv1 has no
// -crf dial - see fpsgame/client.cpp) - whichever index the quality radio happens to be on still
// resolves to this one real number. CALIBRATED against a real measured lossless export (this
// task's own laneA-2-report.md): a real 320x180@15fps clip produced a real 2,307,129-byte
// (video+audio) .mkv over a measured 12.133s -> ~190,153 B/s combined against a 1,296,000 B/s
// raw-video rate for that same resolution/fps = a ~6.8x ratio (matching the same "whole final
// file vs raw-video-only" methodology the mp4/webm ratios above already use). Much LESS
// aggressive than the ~150-492x lossy ratios above, as expected for a genuinely lossless codec -
// and, unlike crf-based lossy encoding, ffv1's real ratio is far more scene-dependent (a static,
// low-detail clip compresses better than a busy firefight); treat this single measurement as a
// representative estimate, not a guarantee, same honesty caveat the page's own hint text carries.
sgExportRatioLossless = "6.8 6.8 6.8"
sgExportResW = [ if (= $clipexportresmode 3) [ result (clipexportscreenw) ] [ result (at "854 1280 1920" $clipexportresmode) ] ]
sgExportResH = [ if (= $clipexportresmode 3) [ result (clipexportscreenh) ] [ result (at "480 720 1080" $clipexportresmode) ] ]
// NOTE: the branches below MUST be bracket-wrapped with `result` (not bare $var references) -
// `if`'s "e"-type branch arguments are compiled as executable blocks, and a bare multi-word
// $-substituted value fed directly as a branch does NOT survive as a single string (confirmed
// empirically while building this page: it silently collapsed to just its first token). Wrapping
// each branch as `[ result $var ]` is the same pattern sgExportResW/sgExportResH (above) already
// use successfully for their own conditional branches.
// QoL batch (lossless export): clipexportlossless is checked FIRST and wins outright - it
// overrides the format radio the same way it overrides quality (fpsgame/client.cpp's exportclip()
// mirrors this exact precedence when it resolves clipexportext).
sgExportRatioSel = [ if $clipexportlossless [ result $sgExportRatioLossless ] [ if $clipexportformatpref [ result $sgExportRatioWebm ] [ result $sgExportRatioMp4 ] ] ]
sgExportRatio = [ result (at (sgExportRatioSel) $clipexportquality) ]
// FLOAT arithmetic end-to-end here (*f/divf), not plain integer math - found the hard way
// while testing this page: a naive integer "bytes*10/1000000" one-decimal-digit trick
// overflows cubescript's 32-bit int well within settings this page actually offers (e.g.
// 1920x1080 @120fps raw bytes/sec is already ~373 million; *10 for one decimal digit is
// ~3.73 BILLION, past the ~2.147 billion signed-32-bit ceiling, and silently wrapped negative
// when first tried here). *f/divf already auto-coerce int operands to float - the same thing
// menus_stats.cfg's own K/D ratio (divf $st_frags (max $st_deaths 1)) already relies on - and
// have vastly more headroom than 32-bit int at these magnitudes, so the fix is to never touch
// plain int ops for anything derived from a byte count.
sgExportRawBps    = [ result (*f (*f (sgExportResW) (sgExportResH)) (*f 1.5 $clipexportfpspref)) ]
sgExportFinalBps  = [ result (divf (sgExportRawBps) (sgExportRatio)) ]
sgExportFmtMBs   = [ result (concatword (divf $arg1 1000000) " MB/s") ]
sgExportFmtGBmin = [ result (concatword (divf (*f $arg1 60) 1000000000) " GB/min") ]
sgExportFmtMBmin = [ result (concatword (divf (*f $arg1 60) 1000000) " MB/min") ]
// Kept deliberately compact (one page, no auto-pagination "2" tab - global-constraints.md's
// ~16-row guiautotab threshold, engine/3dgui.cpp) even though this is a dedicated sub-page
// (not the budget-constrained SwiftGibs tab itself) where the LAYOUT RULE comment at the top
// of this file says extra height would be "fine" - a fixed, small control panel like this one
// reads better as one page than split across an ugly numbered tab, unlike an unbounded list
// (friendmanage's own pagination, menus_profiles.cfg, is the case where splitting is
// unavoidable and "standard"). Every row below earns its place: section labels are folded
// into the same guilist as their radios (a trailing "^f4label" guitext), and both size-estimate
// lines carry their own explanation inline rather than on a separate row.
newgui swiftexport [ guistayopen [
    guititle "Export Clip to Video"
    guibar
    if (strcmp $sgExportClip "") [
        guitext "^f3no clip selected - go back to the clips page and click export.. on one"
    ] [
        guitext (concatword "^f2" $sgExportClip)
        guilist [ guitext "name: " ; guifield sgExportName 24 [] ]
        guitext "^f4blank = automatic name; letters, numbers, - and _ only (anything else is stripped); extension added automatically"
        guilist [ guiradio "MP4" clipexportformatpref 0 ; guistrut 1 ; guiradio "WebM" clipexportformatpref 1 ; guistrut 2 ; guitext "^f4format" ]
        guilist [ guiradio "480p" clipexportresmode 0 ; guistrut 1 ; guiradio "720p" clipexportresmode 1 ; guistrut 1 ; guiradio "1080p" clipexportresmode 2 ; guistrut 1 ; guiradio "match my res" clipexportresmode 3 ]
        guitext (concatword "^f4-> " (sgExportResW) "x" (sgExportResH) "   fps (hard cap 120): ^f7" $clipexportfpspref)
        guislider clipexportfpspref 15 120
        guilist [ guiradio "smaller" clipexportquality 0 ; guistrut 1 ; guiradio "normal" clipexportquality 1 ; guistrut 1 ; guiradio "best" clipexportquality 2 ; guistrut 2 ; guitext "^f4quality" ]
        guicheckbox "include the game's audio in the exported video" clipexportsound
        guicheckbox "show the hud (crosshair, kill feed, scores) in the video" clipexporthud
        // QoL batch (lossless export): a genuinely lossless FFV1-in-Matroska (.mkv) output
        // instead of the compressed MP4/WebM above - the format radio and quality radio just
        // above are both ignored while this is checked (fpsgame/client.cpp's exportclip()
        // overrides clipexportext to "mkv" outright; there is no -crf dial for ffv1). The size
        // estimate below already reflects this the moment it's ticked (sgExportRatioLossless).
        guicheckbox "lossless (huge file)" clipexportlossless
        guitext "^f4when checked: ignores format + quality above, always saves an .mkv - watch the size estimate below, it can be dramatically bigger"
        guilist [ guitext "save into folder: " ; guifield videodir 16 [] ]
        guibar
        guitext (concatword "^f4raw ~" (sgExportFmtMBs (sgExportRawBps)) " (~" (sgExportFmtGBmin (sgExportRawBps)) ") ^f4- never hits disk, piped straight into the encoder")
        // QoL batch (lossless export): the "final" line switches to GB/min once lossless is
        // ticked - a lossless file is routinely gigabytes for even a short clip, and MB/min alone
        // would print an ugly, hard-to-read 4-5 digit number; GB/min is the honest scale for it,
        // same reasoning the raw-intermediate line above already applies unconditionally. Both
        // branches reuse the existing sgExportFmtGBmin/sgExportFmtMBmin helpers verbatim - no new
        // formatting logic, just a different helper call per branch.
        guitext (concatword "^f0final ~" (sgExportFmtMBs (sgExportFinalBps)) " (~" (if $clipexportlossless [ result (sgExportFmtGBmin (sgExportFinalBps)) ] [ result (sgExportFmtMBmin (sgExportFinalBps)) ]) ") ^f0-> " $videodir " - this is what matters")
        guitext "^f4real-time playback, no menus - takes AT LEAST as long as the clip. ESC cancels and stays put; finishing (or any other stop) leaves the replay and returns to the main menu, printing the result."
        guibutton "^f0start export" [ if (strcmp $sgExportClip "") [] [ exportclip $sgExportClip (sgExportResW) (sgExportResH) $clipexportfpspref (at "mp4 webm" $clipexportformatpref) $sgExportName ] ]
    ]
    guibar
    guibutton "back" [ cleargui 1 ]
] ] "export clip"

// ============ Audio tab: everything you hear (4 rows) ============
sgAudioTab = [ guistayopen [
    guitext "^f2Sounds   ^f4pick, preview, and tune volume + pitch"
    guibutton "hit sounds.." [ showgui hitsounds ]
    guibutton "weapon sounds.." [ showgui weaponsounds ]
    guibar
    guicheckbox "weapon switch / reload clunk" gunreloadsound
] ]

// ============ Cues tab: everything you SEE around the fight ============
// Every control demos itself on change - and the demo draws over the menu (post-gui overlay).
sgCuesTab = [ guistayopen [
    guitext (concatword "^f2Reload rhythm   ^f4countdown: ^f7" (at "Off Slam Pulse Collapse Off Orbit Crosshair-Pulse Digits Edge-beats" $reloadcount))
    guilist [ guiradio "Off" reloadcount 0 [reloadcountdemo] ; guiradio "Slam" reloadcount 1 [reloadcountdemo] ; guiradio "Pulse" reloadcount 2 [reloadcountdemo] ]
    guilist [ guiradio "Collapse" reloadcount 3 [reloadcountdemo] ; guiradio "Orbit" reloadcount 5 [reloadcountdemo] ; guiradio "Crosshair-Pulse" reloadcount 6 [reloadcountdemo] ]
    guilist [ guiradio "Digits" reloadcount 7 [reloadcountdemo] ; guiradio "Edge-beats" reloadcount 8 [reloadcountdemo] ]
    guilist [ guitext (concatword "^f4ready flash: ^f7" (at "Off Pip Dot Thin-ring Ring-ping Bloom Burst Edge-pulse" $reloadflash)) ]
    guilist [ guiradio "Off" reloadflash 0 [reloadcountdemo] ; guiradio "Pip" reloadflash 1 [reloadcountdemo] ; guiradio "Dot" reloadflash 2 [reloadcountdemo] ; guiradio "Thin" reloadflash 3 [reloadcountdemo] ]
    guilist [ guiradio "Ping" reloadflash 4 [reloadcountdemo] ; guiradio "Bloom" reloadflash 5 [reloadcountdemo] ; guiradio "Burst" reloadflash 6 [reloadcountdemo] ; guiradio "Edge" reloadflash 7 [reloadcountdemo] ]
    guibutton "cue colours.." [ showgui cuecolors ]
    guilist [ guitext "^f4metronome: " ; guiradio "Off" reloadmetronome 0 ; guiradio "Flat" reloadmetronome 1 [reloadcountdemo] ; guiradio "Rising" reloadmetronome 2 [reloadcountdemo] ]
    guitext "^f4metronome volume"
    guislider reloadmetrovol 0 255 [reloadcountdemo]
    guicheckbox "play the final ready ping" reloadmetroready 1 0 [reloadcountdemo]
    guibar
    guitext "^f2Hits and streaks"
    guilist [ guitext "^f4hit marker: " ; guiradio "Off" hitmarker 0 ; guiradio "Classic" hitmarker 1 [hitmarkerdemo] ; guiradio "X-flash" hitmarker 2 [hitmarkerdemo] ; guiradio "Ring-out" hitmarker 3 [hitmarkerdemo] ; guiradio "Notch" hitmarker 4 [hitmarkerdemo] ]
    guilist [ guicheckbox "killstreak counter" killstreakhud ; guistrut 1 ; guicheckbox "milestone sound" killstreaksound 1 0 [ if $killstreaksound [ playstreaksound ] ] ]
    guilist [ guitext "^f4streak fx: " ; guiradio "Off" killstreakfx 0 ; guiradio "Slam" killstreakfx 1 [streakfxdemo] ; guiradio "Minimal" killstreakfx 2 [streakfxdemo] ]
] ]

// ---- cue colours page: hue shift / mono / opacity for countdown + ready flash.
// Defaults (hue 0, mono off, opacity 100) = the stock look; every control live-demos.
// GOTCHA: guisliders must be STANDALONE rows - inside a horizontal guilist they stick at 0. ----
newgui cuecolors [ guistayopen [
    guitext "countdown hue shift"
    guislider reloadcounthue 0 359 [reloadcountdemo]
    guitext "countdown opacity"
    guislider reloadcountalpha 10 100 [reloadcountdemo]
    guitext "ready flash hue shift"
    guislider reloadflashhue 0 359 [reloadcountdemo]
    guitext "ready flash opacity"
    guislider reloadflashalpha 10 100 [reloadcountdemo]
    guilist [ guicheckbox "countdown mono" reloadcountmono 1 0 [reloadcountdemo] ; guistrut 1 ; guicheckbox "flash mono" reloadflashmono 1 0 [reloadcountdemo] ]
    guibar
    guibutton "back" [ cleargui 1 ]
] ] "cue colours"

// ---- hit sounds page (8 rows; selecting or dragging auditions the sound) ----
newgui hitsounds [ guistayopen [
    guitext (concatword "Hit sound:  " (at "Stock TF2 Quake CoD Custom-1 Custom-2" $hitsoundsel))
    guilist [ guiradio "Stock" hitsoundsel 0 [playhitsoundpreview] ; guiradio "TF2" hitsoundsel 1 [playhitsoundpreview] ; guiradio "Quake" hitsoundsel 2 [playhitsoundpreview] ; guiradio "CoD" hitsoundsel 3 [playhitsoundpreview] ]
    guilist [ guiradio "Custom 1" hitsoundsel 4 [playhitsoundpreview] ; guiradio "Custom 2" hitsoundsel 5 [playhitsoundpreview] ; guibutton "preview" [ playhitsoundpreview ] ]
    guitext "hit sound volume"
    guislider hitsoundvol 0 255 [playhitsoundpreview]
    guitext "hit sound pitch (100 = normal)"
    guislider hitsoundpitch 50 200 [playhitsoundpreview]
    guibar
    guibutton "back" [ cleargui 1 ]
] ] "hit sounds"

// ---- weapon sounds page: local-only fire sound + reload-charge soundscape, each with
// volume + pitch. Pitch 100 = neutral; for the reload charge, pitch also stretches or
// shrinks the 1.5s sweep (metronome stays exact). Sliders STANDALONE (guilist = stuck-at-0). ----
newgui weaponsounds [ guistayopen [
    guitext (concatword "Fire sound:  " (at "Stock Laser Zap Thump" $firesound))
    guilist [ guiradio "Stock" firesound 0 ; guiradio "Laser" firesound 1 [playfirepreview] ; guiradio "Zap" firesound 2 [playfirepreview] ; guiradio "Thump" firesound 3 [playfirepreview] ]
    guitext "fire volume"
    guislider firesoundvol 0 255 [playfirepreview]
    guitext "fire pitch (100 = normal)"
    guislider firesoundpitch 50 200 [playfirepreview]
    guibar
    guitext (concatword "Reload charge:  " (at "Off Laser-charge Rising-hum" $reloadsound))
    guilist [ guiradio "Off" reloadsound 0 ; guiradio "Laser-charge" reloadsound 1 [playreloadpreview] ; guiradio "Rising-hum" reloadsound 2 [playreloadpreview] ]
    guitext "reload charge volume"
    guislider reloadsoundvol 0 255 [playreloadpreview]
    guitext "reload charge pitch (alters length)"
    guislider reloadsoundpitch 50 200 [playreloadpreview]
    guibar
    guibutton "back" [ cleargui 1 ]
] ] "weapon sounds"

// ============ Friends tab: quick add + who's here, bounded (max ~12 rows) ============
// Full list + removal live on the manage page: this tab shows at most 6 in-game rows,
// so a busy 20-player server can't overflow it into numbered tabs.
sgFriendsTab = [ guistayopen [
    guilist [ guitext "Add a friend: " ; guifield sgFriendName 16 [if (strcmp $sgFriendName "") [] [addfriend $sgFriendName; sgFriendName = ""]] ]
    guibar
    guitext "^f2In game now"
    sgShown = 0
    sgOthers = 0
    loop i (numplayers) [
        pn = (getplayername $i)
        if (|| (strcmp $pn "") (strcmp $pn (getname))) [] [
            sgOthers = (+ $sgOthers 1)
            if (< $sgShown 6) [
                sgShown = (+ $sgShown 1)
                guilist [ guitext $pn ; guispring ; if (isfriend $pn) [guitext "^f0(friend)"] [guibutton "^f0+ add" (concatword "addfriend " $pn)] ]
            ] []
        ]
    ]
    if (> $sgOthers $sgShown) [ guitext (concatword "^f4+" (- $sgOthers $sgShown) " more - see manage friends..") ] []
    if (= $sgOthers 0) [ guitext "^f4No other players in game" ] []
    guibar
    guibutton (concatword "manage friends (" (numfriends) ")..") [ showgui friendmanage ]
] ]

// ---- manage friends page: the full lists. If this ever exceeds ~16 rows it paginates
// into numbered pages WITHIN this popup, which is fine (standard for long lists). ----
newgui friendmanage [ guistayopen [
    guitext (concatword "Your friends (" (numfriends) ")")
    guibar
    if (numfriends) [
        loop i (numfriends) [
            fn = (getfriend $i)
            guilist [ guitext $fn ; guispring ; guibutton "^f3remove" (concatword "delfriend " $fn) ]
        ]
    ] [ guitext "^f4No friends yet - add one from the Friends tab" ]
    guibar
    guitext "^f2In game now"
    sgAnyOthers = 0
    loop i (numplayers) [
        pn = (getplayername $i)
        if (|| (strcmp $pn "") (strcmp $pn (getname))) [] [
            sgAnyOthers = 1
            guilist [ guitext $pn ; guispring ; if (isfriend $pn) [guitext "^f0(friend)"] [guibutton "^f0+ add" (concatword "addfriend " $pn)] ]
        ]
    ]
    if $sgAnyOthers [] [ guitext "^f4No other players in game" ]
    guibar
    guibutton "back" [ cleargui 1 ]
] ] "manage friends"

// ---- feedback page (F8 in-game, or via the SwiftGibs tab) ----
// guifield with a NEGATIVE length = wrapped free-text field (engine cap ~260
// chars; the relay allows more but this is the practical in-game limit).
// sendfeedback (patch 14) blocks briefly with a progress bar (esc aborts) and
// reports into $feedbackstatus. It auto-attaches telemetry (map, mode,
// position, fps, platform) plus the match stats passed as the info arg; the
// F8 path (feedbackshot alias in autoexec) also snaps screenshot/
// feedbackshot.jpg first and sets sgFbShot so the send includes it.
newgui feedback [ guistayopen [
    guitext "Found a bug? Got an idea? Tell us"
    guitext "^f4posted publicly at github.com/SalukiSwift/swiftgibs/issues"
    guitext "^f4includes map, score + system info to help us fix it"
    guibar
    guilist [ guitext "Type: " ; guiradio "bug" sgFbCat 0 ; guistrut 1 ; guiradio "idea" sgFbCat 1 ; guistrut 1 ; guiradio "other" sgFbCat 2 ]
    guifield sgFbText -28 []
    guicheckbox "sign with my player name (otherwise anonymous)" sgFbName
    if $sgFbShot [ guicheckbox "attach screenshot (the moment F8 was pressed)" sgFbShot ] []
    guilist [ guibutton "^f0send" [ if (strcmp $sgFbText "") [ feedbackstatus = "type something first" ] [ sendfeedback (if $sgFbName [getname] [result ""]) (at "bug idea other" $sgFbCat) $swiftgibsversion $sgFbText $sgFbShot (concatword "frags " (getfrags) ", deaths " (getdeaths) ", damage " (gettotaldamage) ", shots " (gettotalshots) ", best streak " (getbeststreak)) ] ] ; guistrut 2 ; guibutton "clear" [ sgFbText = "" ; feedbackstatus = "" ] ]
    guitext (concatword "^f2" $feedbackstatus)
    guibar
    guitext "^f4tip: F8 during a game opens this with a screenshot"
    guibutton "back" [ cleargui 1 ]
] ] "send feedback"
