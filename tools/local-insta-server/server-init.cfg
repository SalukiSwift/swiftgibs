// Local instagib FFA server - fdm6, instant respawns.
// This file is the server's home config (run-server.sh passes -q at this dir).

serverport 28785
updatemaster 0              // never register on the public master list
maxclients 8
serverdesc "Swifties Local Insta"

defaultmap "fdm6"           // boot straight into this, and reset to it when empty
defaultmode 3               // 3 = instagib FFA

autospawn 1                 // server respawns dead players itself
autospawndelay 0            // extra ms after the engine's 300ms hit-flush window

maprotation "instagib" "fdm6"   // when the timer runs out with no votes, back to fdm6
