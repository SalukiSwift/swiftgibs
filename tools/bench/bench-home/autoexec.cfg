// SwiftGibs benchmark profile - pinned overrides layered ON TOP of the bundle's real shipped
// autoexec.cfg, not a replacement for it. The runner (run-benchmark.sh/.bat) generates the
// actual bench-home-run/autoexec.cfg by execing the bundle's real autoexec.cfg first, then
// appending this file's content - so every run measures the SHIPPED first-run defaults
// (shaderdetail, blood, ragdoll, hidedead, forceplayermodels, swiftgibsversion, etc.), with
// only the settings below pinned for run-to-run comparability. This home dir is recreated
// fresh by the runner on every invocation - never the player's real config.
fpsstats 0          // no double instrumentation
fullscreen 1
soundvol 255        // sound cost is part of the frame
musicvol 0
maxfps 0            // uncapped (sgbench also forces this via benchmeasuring)
