// SwiftGibs benchmark profile - pinned settings so every run is config-identical.
// This home dir is recreated fresh by the runner on every invocation.
fpsstats 0          // no double instrumentation
fullscreen 1
soundvol 255        // sound cost is part of the frame
musicvol 0
maxfps 0            // uncapped (sgbench also forces this via benchmeasuring)
